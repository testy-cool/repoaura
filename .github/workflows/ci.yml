name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: repoaura-chrome
          path: .build/repoaura-1.0.0-chrome.zip
          if-no-files-found: error
